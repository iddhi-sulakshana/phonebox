[package]
name = "phonebox"
description = "PhoneBox desktop agent library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
regex = "1"
# outbound HTTP; TLS (rustls) comes with the first plan that needs it
reqwest = { version = "0.12", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# the process table (ProcessMonitor): names, CPU time, memory and start times on every OS
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# shortcut icon uploads: the revision (SHA-256) and the SVG check (an XML parser that never fetches a DTD)
sha2 = "0.10"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_IO",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
