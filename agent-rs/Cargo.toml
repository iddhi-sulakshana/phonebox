[workspace]
resolver = "3"
members = ["crates/phonebox", "crates/phonebox-agent"]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/iddhi-sulakshana/phonebox"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
