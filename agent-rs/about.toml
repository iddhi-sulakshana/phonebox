# cargo-about's settings for THIRD-PARTY-NOTICES.txt (agent-rs/scripts/notices.sh): every crate the five release
# targets build (normal, build and dev dependencies), but the workspace's own. tools/check-notices.py compares it with
# `cargo tree` for the same targets.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
]
private = { ignore = true }
