name: rust

on:
  # main and pull requests (a branch with an open pull request would otherwise run everything twice, and macOS runners
  # are few)
  push:
    branches: [main]
    # the agent embeds the panel and (until the switch) the settings page and catalogs from agent/, the C# oracle
    paths: ["agent-rs/**", "agent/**", "android/app/src/main/assets/www/**", "tools/parity/**", "tools/ui-tests/**", "tools/check-notices.py", "tools/zip-agent.py", "tools/smoke-agent.py", "tools/test-release-metadata.py", ".github/workflows/rust.yml"]
  pull_request:
    # the agent embeds the panel and (until the switch) the settings page and catalogs from agent/, the C# oracle
    paths: ["agent-rs/**", "agent/**", "android/app/src/main/assets/www/**", "tools/parity/**", "tools/ui-tests/**", "tools/check-notices.py", "tools/zip-agent.py", "tools/smoke-agent.py", "tools/test-release-metadata.py", ".github/workflows/rust.yml"]
  workflow_dispatch:
  # the release workflow runs the same checks first
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-latest, os: ubuntu-latest, target: "" }
          - { name: ubuntu-24.04-arm, os: ubuntu-24.04-arm, target: "" }
          - { name: macos-latest, os: macos-latest, target: "" }
          # the Intel Mac build, its tests run by Rosetta 2 on Apple silicon (the Intel runners are several times slower)
          - { name: macos x64 under Rosetta, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-latest, os: windows-latest, target: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install 1.98.0 --profile minimal -c clippy,rustfmt ${{ matrix.target && format('-t {0}', matrix.target) || '' }}
      - name: Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent-rs
          key: ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings
      - run: cargo test --locked --workspace ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      # the notices every zip carries must name each crate the agent is built from (agent-rs/scripts/notices.sh)
      - name: Third-party notices and the release version checks
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          python3 -I tools/check-notices.py
          python3 -I tools/test-release-metadata.py

  # The Intel Mac build on an Intel Mac, natively: PhoneBox's own macOS 15 x86_64 VM, a throwaway runner (each job
  # boots a fresh copy of a clean image, which is discarded after the job). Never for pull requests from forks, and
  # not when the release workflow calls this one (there github.workflow is "release"): this single runner can be
  # offline, so the Rosetta 2 jobs stay the gate.
  intel-native:
    name: test and smoke (macos x64, native)
    if: github.workflow == 'rust' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install 1.98.0 --profile minimal -c clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent-rs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build the agent
        run: cargo build --release --locked -p phonebox-agent
      - name: Smoke-test the agent
        working-directory: .
        run: python3 -I tools/smoke-agent.py agent-rs/target/release/PhoneBoxAgent --version "$(sed -n 's/^version = "\(.*\)"$/\1/p' agent-rs/Cargo.toml | head -n1)"

  # What the release ships, built the same way on every push: one executable per target, signed on macOS (with a
  # throwaway certificate here), smoke-tested on its own architecture, and zipped with the notices.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: .exe, target: "" }
          - { os: ubuntu-22.04, rid: linux-x64, exe: "", target: "" }
          - { os: ubuntu-22.04-arm, rid: linux-arm64, exe: "", target: "" }
          - { os: macos-latest, rid: osx-arm64, exe: "", target: "" }
          # built for Intel on Apple silicon; the smoke test runs it under Rosetta 2
          - { os: macos-latest, rid: osx-x64, exe: "", target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install 1.98.0 --profile minimal ${{ matrix.target && format('-t {0}', matrix.target) || '' }}
      - name: Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent-rs
          key: ${{ matrix.rid }}
      - name: Build the agent
        working-directory: agent-rs
        run: cargo build --release --locked -p phonebox-agent ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Stage the zip's two files
        id: stage
        shell: bash
        run: |
          mkdir out
          cp "agent-rs/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/PhoneBoxAgent${{ matrix.exe }}" agent-rs/THIRD-PARTY-NOTICES.txt out/
          # the first `version =` of agent-rs/Cargo.toml is [workspace.package]'s (Ubuntu 22.04's Python has no tomllib)
          echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' agent-rs/Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      # the release signs with PhoneBox's own certificate; the same action with a throwaway one here (as build.yml)
      - name: Throwaway signing certificate (macOS)
        id: cert
        if: startsWith(matrix.rid, 'osx-')
        run: |
          bash tools/make-macos-signing-cert.sh --out "$RUNNER_TEMP/cert"
          password="$(cat "$RUNNER_TEMP/cert/phonebox-macos-signing.password")"
          echo "::add-mask::$password"
          {
            echo "p12=$(base64 < "$RUNNER_TEMP/cert/phonebox-macos-signing.p12" | tr -d '\n')"
            echo "password=$password"
          } >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/cert"
          printf 'int main(void) { return 0; }\n' | clang -x c - -o "$RUNNER_TEMP/other-build"
      - name: Sign the macOS agent (throwaway certificate)
        if: startsWith(matrix.rid, 'osx-')
        uses: ./.github/actions/sign-macos-agent
        with:
          binary: out/PhoneBoxAgent
          p12-base64: ${{ steps.cert.outputs.p12 }}
          p12-password: ${{ steps.cert.outputs.password }}
      - name: Sign a different program with the same certificate
        if: startsWith(matrix.rid, 'osx-')
        uses: ./.github/actions/sign-macos-agent
        with:
          binary: ${{ runner.temp }}/other-build
          p12-base64: ${{ steps.cert.outputs.p12 }}
          p12-password: ${{ steps.cert.outputs.password }}
      - name: Signature checks (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          if security find-certificate -c "PhoneBox Agent" >/dev/null 2>&1; then echo "::error::the signing keychain was left behind"; exit 1; fi
          codesign --verify --strict --verbose=2 out/PhoneBoxAgent
          requirement="$(codesign -d -r- out/PhoneBoxAgent 2>&1 | sed -n 's/^designated => //p')"
          echo "Designated requirement: $requirement"
          codesign --verify --verbose=2 -R="$requirement" "$RUNNER_TEMP/other-build"
          cp "$RUNNER_TEMP/other-build" "$RUNNER_TEMP/adhoc-build"
          codesign --force --sign - --identifier net.oxog.phonebox.agent "$RUNNER_TEMP/adhoc-build"
          if codesign --verify -R="$requirement" "$RUNNER_TEMP/adhoc-build" 2>/dev/null; then echo "::error::an ad hoc build satisfies the requirement"; exit 1; fi
      - name: Check the Windows executable
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = 'out/PhoneBoxAgent.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $subsystem = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 0x5C)
          if ($subsystem -ne 2) { throw "not a GUI program (subsystem $subsystem)" }
          if ([Text.Encoding]::ASCII.GetString($bytes).ToLowerInvariant().Contains('vcruntime140')) { throw 'needs VCRUNTIME140.dll' }
          $product = (Get-Item $exe).VersionInfo.ProductVersion
          if ($product -ne '${{ steps.stage.outputs.version }}') { throw "ProductVersion is '$product'" }
      - name: Check the glibc the Linux agent needs
        if: startsWith(matrix.rid, 'linux-')
        run: |
          newest=$(objdump -T out/PhoneBoxAgent | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "needs $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -n1)" = GLIBC_2.35 ]
      # on its own architecture, or under Rosetta 2 for the Intel Mac build
      - name: Smoke-test the agent
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" tools/smoke-agent.py "out/PhoneBoxAgent${{ matrix.exe }}" --version "${{ steps.stage.outputs.version }}"
      - name: Zip (the two files at its root)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          mkdir -p dist
          "$py" tools/zip-agent.py out "dist/PhoneBoxAgent-${{ steps.stage.outputs.version }}-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-agent-${{ matrix.rid }}
          path: dist/

  # The Rust agent against the C# agent it replaces (the baseline in agent/, 0.9.23, built as users run it on each OS),
  # side by side on the phase-1 to phase-7 corpora (phases 4 to 6 over Wi-Fi, all with the same fixture certificate). Linux runs on the test server (agent-rs/scripts/remote-parity.sh).
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: the comparison is about behavior, which does not depend on the processor (the Intel
          # build's own tests run under Rosetta 2 in the test job)
          - { os: macos-latest, tfm: net10.0, exe: "", python: python3 }
          - { os: windows-latest, tfm: net10.0-windows10.0.19041.0, exe: ".exe", python: python }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent-rs
      - name: Build the C# agent
        run: dotnet build -c Release agent/PhoneBox.Agent -f ${{ matrix.tfm }} -v q -nologo
      - name: Build the Rust agent
        working-directory: agent-rs
        run: cargo build --release --locked
      - name: Parity, phase 1
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase1.json
      - name: Parity, phase 2
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase2.json
      - name: Parity, phase 3
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase3.json
      - name: Parity, phase 4 (Wi-Fi, with the fixture certificate)
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase4.json
          --fixture tools/parity/fixtures/lan.json
      - name: Parity, phase 5 (AI and dev; the hook routes' Wi-Fi denial)
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase5.json
          --fixture tools/parity/fixtures/lan.json
      - name: Parity, phase 6 (integrations and the deck; webhooks and the phone key over Wi-Fi)
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase6.json
          --fixture tools/parity/fixtures/deck.json
      - name: Parity, phase 7 (the update routes; local only over Wi-Fi)
        shell: bash
        run: >-
          ${{ matrix.python }} -I tools/parity/parity.py
          --csharp "agent/PhoneBox.Agent/bin/Release/${{ matrix.tfm }}/PhoneBoxAgent${{ matrix.exe }}"
          --rust "agent-rs/target/release/PhoneBoxAgent${{ matrix.exe }}"
          --corpus tools/parity/corpus/phase7.json
          --fixture tools/parity/fixtures/lan.json
      - name: Parity harness and comparison script tests
        shell: bash
        run: |
          ${{ matrix.python }} -I tools/parity/test_parity.py
          ${{ matrix.python }} -I agent-rs/scripts/test_compare_pc_ping.py

  # The browser suite of tools/ui-tests/live against live agents (settings load and save, the X-Config-Version
  # conflict, the live preview, Wi-Fi pairing and its QR codes, shortcut icons): the C# agent first, which proves the
  # suite, then the Rust agent. On the test server: agent-rs/scripts/remote-ui-live.sh.
  ui-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent-rs
      - name: Install Playwright
        working-directory: tools/ui-tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build the C# agent
        run: dotnet build -c Release agent/PhoneBox.Agent -f net10.0 -v q -nologo
      - name: Build the Rust agent
        id: rust-build
        working-directory: agent-rs
        run: cargo build --release --locked
      - name: The suite against the C# agent
        working-directory: tools/ui-tests
        run: npx playwright test -c live
        env:
          CI: '1'
          PHONEBOX_AGENT_CMD: agent/PhoneBox.Agent/bin/Release/net10.0/PhoneBoxAgent
          PHONEBOX_AGENT_LABEL: csharp
      # also after a C# failure, so one run shows both agents
      - name: The suite against the Rust agent
        if: ${{ !cancelled() && steps.rust-build.outcome == 'success' }}
        working-directory: tools/ui-tests
        run: npx playwright test -c live
        env:
          CI: '1'
          PHONEBOX_AGENT_CMD: agent-rs/target/release/PhoneBoxAgent
          PHONEBOX_AGENT_LABEL: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-live-report
          path: |
            ui-test-report/live-*/
            tools/ui-tests/test-results/
