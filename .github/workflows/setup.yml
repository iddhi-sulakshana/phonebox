name: setup

# Runs the one-step installers (setup.ps1, setup.sh) for real against the newest published release, pre-releases
# included (-Pre / --pre): download, checksum, dependencies, install, start, and a second run that updates a running
# agent. While the repository has no published release the jobs skip with a notice.
on:
  pull_request:
    paths: [setup.ps1, setup.sh, tools/test-unix-setup-phone.py, .github/workflows/setup.yml]
  push:
    branches: [main]
    paths: [setup.ps1, setup.sh, tools/test-unix-setup-phone.py, .github/workflows/setup.yml]
  schedule:
    - cron: '17 6 * * 1'   # weekly: the latest release against current winget, Homebrew and distribution packages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs run downloaded programs and need no Git access
      - name: shellcheck
        run: |
          bash -n setup.sh
          shellcheck setup.sh
      - name: Unix setup phone-download regression
        run: python3 tools/test-unix-setup-phone.py
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path setup.ps1 -Severity Error, ParseError
          $issues | Format-Table -AutoSize | Out-String -Width 200
          if ($issues) { throw "PSScriptAnalyzer: $($issues.Count) error(s)" }

  windows:
    name: setup.ps1 (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs run downloaded programs and need no Git access
      # The newest published release, pre-releases included (only 1.0.0-alpha.N exist before 1.0.0); none yet: skip
      - name: Newest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" \
            | python3 -c 'import json, sys; print(next((r["tag_name"] for r in json.load(sys.stdin) if not r["draft"]), ""))')
          if [ -z "$tag" ]; then echo "::notice::${{ github.repository }} has no published release yet: nothing to install"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: First install
        if: steps.release.outputs.tag != ''
        shell: powershell
        run: '& ([scriptblock]::Create((Get-Content -Raw .\setup.ps1))) -Yes -NoPhone -Pre -AllowAdministrator'
      - name: Check the running agent
        if: steps.release.outputs.tag != ''
        shell: powershell
        run: |
          $info = Invoke-RestMethod http://127.0.0.1:8765/api/info
          "version $($info.version), adb $($info.adb)"
          if (-not $info.adb) { throw 'setup did not install adb' }
          if (-not (Test-Path "$env:LOCALAPPDATA\PhoneBox\app\PhoneBoxAgent.exe")) { throw 'agent not in the install folder' }
          if (-not (Test-Path ([Environment]::GetFolderPath('Startup') + '\PhoneBox.lnk'))) { throw 'no Startup shortcut' }
      - name: Second run replaces a running agent
        if: steps.release.outputs.tag != ''
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw .\setup.ps1))) -Yes -NoPhone -Pre -AllowAdministrator
          Invoke-RestMethod http://127.0.0.1:8765/api/info | Select-Object version, os
      - name: Stop the agent
        if: always()
        shell: powershell
        run: Get-Process PhoneBoxAgent -ErrorAction SilentlyContinue | Stop-Process -Force

  unix:
    name: setup.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs run downloaded programs and need no Git access
      # The newest published release, pre-releases included (only 1.0.0-alpha.N exist before 1.0.0); none yet: skip
      - name: Newest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" \
            | python3 -c 'import json, sys; print(next((r["tag_name"] for r in json.load(sys.stdin) if not r["draft"]), ""))')
          if [ -z "$tag" ]; then echo "::notice::${{ github.repository }} has no published release yet: nothing to install"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: First install (piped, as with curl | bash)
        if: steps.release.outputs.tag != ''
        run: cat setup.sh | bash -s -- --yes --no-phone --pre
      - name: Check the running agent
        if: steps.release.outputs.tag != ''
        run: |
          curl -fsS http://127.0.0.1:8765/api/info | tee /tmp/info.json; echo
          python3 -c 'import json; i = json.load(open("/tmp/info.json")); assert i["adb"], "setup did not install adb"'
      - name: Second run replaces a running agent
        if: steps.release.outputs.tag != ''
        run: |
          bash setup.sh --yes --no-phone --no-extras --pre
          curl -fsS http://127.0.0.1:8765/api/info >/dev/null
      - name: Stop the agent
        if: always()
        run: |
          launchctl unload "$HOME/Library/LaunchAgents/net.oxog.phonebox.agent.plist" 2>/dev/null || true
          systemctl --user stop phonebox.service 2>/dev/null || true
          pkill -x PhoneBoxAgent || true
